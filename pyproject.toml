[project]
name = "aereo-geospatial-api"
version = "0.1.0"
description = "Geospatial uploads and projected feature measurements"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "pandas>=2,<4", "uvicorn>=0.30,<1", "geopandas>=1.0,<2", "shapely>=2.1,<3", "pyproj>=3.6,<4", "pyogrio>=0.10,<1", "python-multipart>=0.0.18,<1", "defusedxml>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE"]
